[build-system]
requires = ["poetry_core>=1.0.0"]
build-backend = "poetry.masonry.api"

[tool.poetry]
name = "Ashes.live"
description = "API backend for a fan-developed deckbuilder and community website for the card game Ashes Reborn"
version = "2.0.0a1"
license = "ISC"
readme = "README.md"
authors = ["Ian Beck <ian@onecrayon.com>"]
packages =[
    { include = "api" }
]

[tool.poetry.dependencies]
python = "^3.13.15"
fastapi = "^0.141.1"
gunicorn = "^26.2.0"
sqlalchemy = "^2.0.43"
alembic = "^1.4.2"
psycopg2 = "^2.8.5"
python-jose = {extras = ["cryptography"], version = "^3.2.0"}
bcrypt = "^5.0.0"
python-multipart = "^0.0.32"
email-validator = "^2.2.0"
# Install uvicorn with the pieces from uvicorn[standard] that we will actually use
uvicorn = "^0.52.4"
uvloop = "^0.22.1"
httptools = "^0.8.0"
pydantic-settings = "^2.4.0"
httpx = "^0.28.1"
sendgrid = "^6.12.4"
# Pin greenlet (a dependency of SQLAlchemy) because the latest version wheels aren't
#  building in my prod webhost
greenlet = "==3.2.5"

[tool.poetry.group.dev.dependencies]
# These are used by the test suite
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
sqlalchemy-utils = "^0.42.1"
freezegun = "^1.1.0"
# These are used by `make format`
black = "^26.5.1"
isort = "^9.0.1"

[tool.poetry.group.vscode.dependencies]
# These are used by VSCode
pylint = "^4.0.8"
rope = "^1.2.0"

[tool.isort]
profile = "black"
multi_line_output = 3
